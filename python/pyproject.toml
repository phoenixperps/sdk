[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "phoenixperps"
version = "1.0.0"
description = "The Phoenix Perpetuals API: REST (sync and async), the account stream and market data, with retries, idempotency and typed errors."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "websockets>=13,<16"]
keywords = ["phoenix perpetuals", "perpetuals", "trading", "api", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://docs.phoenixperpsfunding.com"
Repository = "https://github.com/phoenixperps/sdk"

[project.optional-dependencies]
test = ["pytest>=8", "pyflakes>=3", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/phoenixperps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
